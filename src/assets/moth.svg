<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 124">
  <!-- Moth: a hooded figure in the back room, moth-eye goggles glowing under a bare bulb.
       characters.css animates the classed parts: the bulb sways, the goggles flicker while Moth talks. -->
  <defs>
    <radialGradient id="moth-lamp" cx="0.8" cy="0.15" r="0.95">
      <stop offset="0" stop-color="#7a4a14"/><stop offset="0.45" stop-color="#2e1a12"/><stop offset="1" stop-color="#0d0a1f"/>
    </radialGradient>
    <radialGradient id="moth-lens" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3cf"/><stop offset="0.25" stop-color="#ffb648"/><stop offset="0.7" stop-color="#d9861c"/>
      <stop offset="1" stop-color="#5a2d0c"/>
    </radialGradient>
    <filter id="moth-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="190" height="124" fill="url(#moth-lamp)"/>

  <!-- Cloak and hood -->
  <path d="M0,124 L0,108 C20,96 40,88 56,84 C60,66 62,46 68,32 C74,16 86,8 95,8 C104,8 116,16 122,32
           C128,46 130,66 134,84 C150,88 170,96 190,108 L190,124 Z" fill="#0a0716"/>
  <path d="M56,84 C62,96 68,108 72,124 M134,84 C128,96 122,108 118,124" stroke="#1d1430" stroke-width="2" fill="none"/>

  <!-- Rim light from the bulb -->
  <path d="M56,84 C60,66 62,46 68,32 C74,16 86,8 95,8 C104,8 116,16 122,32 C128,46 130,66 134,84"
        fill="none" stroke="#ffb648" stroke-width="1.3" opacity="0.8" filter="url(#moth-glow)"/>
  <path d="M0,108 C20,96 40,88 56,84 M134,84 C150,88 170,96 190,108" fill="none" stroke="#ffb648" stroke-width="1" opacity="0.4"/>

  <!-- Face in shadow -->
  <path d="M78,38 C82,26 108,26 112,38 C117,54 114,74 108,84 C101,91 89,91 82,84 C76,74 73,54 78,38 Z" fill="#030208"/>

  <!-- Moth-eye goggles -->
  <g class="portrait-eye" filter="url(#moth-glow)">
    <circle cx="87" cy="52" r="6.4" fill="url(#moth-lens)"/>
    <circle cx="103" cy="52" r="6.4" fill="url(#moth-lens)"/>
  </g>
  <g fill="none" stroke="#3a1d06" stroke-width="0.7" opacity="0.8">
    <circle cx="87" cy="52" r="3.4"/><circle cx="103" cy="52" r="3.4"/>
  </g>
  <circle cx="85.4" cy="50.2" r="1.1" fill="#ffffff"/>
  <circle cx="101.4" cy="50.2" r="1.1" fill="#ffffff"/>
  <path d="M93.4,52 L96.6,52" stroke="#5a2d0c" stroke-width="1.6"/>

  <!-- Respirator -->
  <path d="M86,67 C90,63 100,63 104,67 L106,76 C100,81 90,81 84,76 Z" fill="#160f26" stroke="#5a2d0c" stroke-width="0.8"/>
  <circle cx="86.5" cy="75" r="3.2" fill="#160f26" stroke="#5a2d0c" stroke-width="0.7"/>
  <circle cx="103.5" cy="75" r="3.2" fill="#160f26" stroke="#5a2d0c" stroke-width="0.7"/>
  <path d="M92,70 L98,70 M91.5,73 L98.5,73" stroke="#d9861c" stroke-width="0.8" opacity="0.6"/>

  <!-- The bare bulb over the bench -->
  <g class="portrait-bulb">
    <path d="M158,0 L158,20" stroke="#3a2614" stroke-width="1"/>
    <circle cx="158" cy="24" r="4" fill="#ffe3a8" filter="url(#moth-glow)"/>
  </g>
</svg>
